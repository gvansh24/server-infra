# God's Eye View (gvansh24/gods-eye-view, branch live) on its own port.
# The app hard-codes root paths (/api, /models, /logo.svg), so it is served at "/".
# When a domain arrives: change listen/server_name here and add the name to
# GEV_ALLOWED_HOSTS in the app's .env.

# Per-visitor throttle on the data proxies. The app's own per-IP limits can't tell
# visitors apart here, because every request reaches it from this gateway's IP.
limit_req_zone $binary_remote_addr zone=gev_api:10m rate=30r/s;

# A missing /assets/ file comes back as the SPA's index.html with 200; never let
# that be cached for a year under an asset URL.
map $sent_http_content_type $gev_asset_cache {
    ~*^text/html  "no-cache";
    default       "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;
    resolver 127.0.0.11 valid=30s;
    set $gods_eye_view http://gods_eye_view:4173;

    proxy_http_version 1.1;
    # $http_host keeps the port: the app compares it with the browser's Origin, and
    # $host would turn every map request into a 403.
    proxy_set_header Host $http_host;
    # These also make the app refuse its key-spending routes (Places, TomTom, OpenAI,
    # Gemini). That is intended while this instance is public.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # The client still posts voice debug logs; answer here so they never reach the disk.
    location = /api/realtime/debug-log {
        return 204;
    }

    location /api/ {
        limit_req zone=gev_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass $gods_eye_view;
    }

    # Vite content-hashes everything under /assets/, so a changed file gets a new
    # name: browsers may keep these forever instead of re-checking each visit.
    # (/cesium/ is not hashed, so it keeps the app's revalidating no-cache.)
    location /assets/ {
        proxy_pass $gods_eye_view;
        proxy_hide_header Cache-Control;
        # No "always": error responses must not be cached for a year.
        add_header Cache-Control $gev_asset_cache;
    }

    location / {
        proxy_pass $gods_eye_view;
    }
}
